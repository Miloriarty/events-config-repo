server:
  port: 8084
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: postgres
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # SSE-запрос живёт долго и не должен держать сессию Hibernate
    open-in-view: false
  # По умолчанию письма уходят в Mailpit из docker-compose.yml.
  # Для настоящей почты задайте MAIL_* в окружении сервиса, см. README
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          # зависший SMTP-сервер не должен останавливать обработку очереди
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  rabbitmq:
    listener:
      simple:
        # после исчерпания попыток сообщение уходит в DLQ, а не возвращается в очередь
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@events-platform.local}
